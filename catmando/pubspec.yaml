name: catmando
description: Cat Tower — stack cats and build the tallest tower.
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flame: 1.30.0
  flame_forge2d: ^0.19.0+3
  flame_audio: ^2.11.7
  google_mobile_ads: ^6.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/cats/cat1.png
    - assets/cats/cat2.png
    - assets/cats/cat3.png
    - assets/cats/cat4.png
    - assets/cats/cat5.png
    - assets/cats/cat6.png
    - assets/cats/cat7.png
    - assets/cats/cat8.png
    - assets/cats/cat9.png
    - assets/cats/cat10.png
    - assets/cats/cat11.png
    - assets/cats/cat12.png
    - assets/cats/cat13.png
    - assets/cats/cat14.png
    - assets/cats/cat15.png
    - assets/cats/cat16.png
    - assets/cats/cat17.png
    - assets/cats/cat18.png
    - assets/cats/cat19.png
    - assets/cats/cat20.png
    - assets/cats/cat21.png
    - assets/music/jump.mp3
    - assets/music/gameover.mp3
    - assets/music/menu.mp3
    - assets/music/nature.mp3

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#ffffff"
    image: assets/images/logo.png
    icon_background_color: "#ffffff"
